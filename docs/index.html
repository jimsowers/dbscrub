<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DbScrub — Getting Started</title>

<!--
  The Pages root. Exists so https://<user>.github.io/dbscrub/ lands on the guide
  instead of 404ing, while the real file keeps a name that says what it is when
  you are browsing the repository.

  A meta refresh rather than a copy of the guide: two files with the same content
  is two files to keep in step, and the one nobody edits is the one people read.
  The canonical link tells search engines and link previews which URL is real.
-->
<meta http-equiv="refresh" content="0; url=getting-started.html">
<link rel="canonical" href="getting-started.html">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f6f8fb;
    color: #16243a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  @media (prefers-color-scheme: dark) { body { background: #0d1726; color: #e6edf7; } }
  a { color: #0d9488; }
  @media (prefers-color-scheme: dark) { a { color: #2dd4bf; } }
  p { margin: .5rem 0; }
</style>
</head>
<body>
  <!-- Shown only if the refresh does not fire: scripting off, a strict proxy, or
       a browser that ignores meta refresh. Never a dead end. -->
  <div>
    <p>Taking you to the DbScrub getting-started guide.</p>
    <p><a href="getting-started.html">Open it now</a> if nothing happens.</p>
  </div>
</body>
</html>
